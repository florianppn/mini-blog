@if (dialogService.activeDialog(); as dialog) {
  <div
    class="fixed inset-0 z-50 overflow-y-auto"
    aria-labelledby="modal-title"
    role="dialog"
    aria-modal="true">
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-zinc-900/40 backdrop-blur-[2px] transition-opacity"
      (click)="dialogService.handleCancel()">
    </div>

    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <!-- Modal Card -->
      <div
        class="relative transform overflow-hidden rounded-xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-zinc-200"
        (click)="$event.stopPropagation()">

        <div class="bg-white p-6">
          <div class="sm:flex sm:items-start gap-4">
            
            <!-- Icon badge according to variant -->
            <div
              class="mx-auto flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg sm:mx-0"
              [ngClass]="getBadgeClass(dialog.variant)">
              
              @if (dialog.variant === 'danger') {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              } @else if (dialog.variant === 'warning') {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
              } @else if (dialog.variant === 'success') {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
              } @else {
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
              }
            </div>

            <!-- Text Content -->
            <div class="mt-3 text-center sm:mt-0 sm:text-left flex-1">
              <h3 class="text-base font-semibold text-zinc-900" id="modal-title">
                {{ dialog.title }}
              </h3>
              <div class="mt-2">
                <p class="text-sm text-zinc-600 leading-relaxed whitespace-pre-line">
                  {{ dialog.message }}
                </p>
              </div>
            </div>

          </div>
        </div>

        <!-- Action Buttons -->
        <div class="bg-zinc-50 px-6 py-3.5 flex flex-col-reverse sm:flex-row sm:justify-end gap-2 border-t border-zinc-200/80">
          <button
            type="button"
            (click)="dialogService.handleCancel()"
            class="inline-flex w-full justify-center rounded-lg bg-white px-3.5 py-2 text-sm font-medium text-zinc-700 shadow-sm border border-zinc-300 hover:bg-zinc-50 transition sm:w-auto">
            {{ dialog.cancelText }}
          </button>

          <button
            type="button"
            (click)="dialogService.handleConfirm()"
            [ngClass]="getButtonClass(dialog.variant)"
            class="inline-flex w-full justify-center rounded-lg px-3.5 py-2 text-sm font-medium shadow-sm transition sm:w-auto">
            {{ dialog.confirmText }}
          </button>
        </div>

      </div>
    </div>
  </div>
}
